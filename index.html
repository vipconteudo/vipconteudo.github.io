<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteúdo Premium</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #1a001a);
      color: #fff;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #ff4da6;
    }

    .container {
      margin-top: 60px;
    }

    .card {
      background: #111;
      padding: 30px;
      border-radius: 25px;
      width: 320px;
      margin: auto;
      box-shadow: 0 0 25px rgba(255, 77, 166, 0.5);
    }

    .price {
      font-size: 36px;
      color: #ff4da6;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      background: #ff4da6;
      border: none;
      padding: 15px 30px;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(255,77,166,0.6);
    }

    button:hover {
      background: #ff1a8c;
      transform: scale(1.07);
    }

    .videos {
      margin-top: 50px;
    }

    .video-box {
      background: #111;
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 0 20px rgba(255,77,166,0.4);
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: #000;
    }

    h3 {
      color: #ff4da6;
    }

    .lock {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>🔥 Conteúdo Premium 🔥</header>

<div class="container">

  <div class="card">
    <h2>Acesso Premium</h2>
    <p>Conteúdo exclusivo liberado após pagamento</p>

    <div class="price">R$ 19,99</div>

    <a href="https://pay.kiwify.com.br/zog76UM" target="_blank">
      <button>🔥 Comprar Agora 🔥</button>
    </a>
  </div>

  <div class="videos">
    <h2>🎬 Prévia do conteúdo</h2>

    <div class="video-box">
      <h3>Video😈🔥 (Prévia)</h3>

      <video controls>
        <source src="/video1.mp4" type="video/mp4">
      </video>

      <p class="lock">
        🔒 O restante do conteúdo é liberado somente após a compra
      </p>
    </div>
  </div>

</div>

</body>
</html>
